<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2400" viewBox="0 0 1440 2400">
  <rect width="1440" height="2400" fill="#f8fafc"/>
  <rect y="0" width="1440" height="88" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="48" y="54" font-size="32" font-family="sans-serif" font-weight="700" fill="#111827">ミテカラ</text>
  <text x="870" y="54" font-size="24" font-family="sans-serif" fill="#2563eb">サービス特徴  料金  FAQ  会社概要  お問い合わせ</text>

  <rect y="88" width="1440" height="520" fill="#dbeafe"/>
  <text x="100" y="210" font-size="66" font-family="sans-serif" font-weight="700" fill="#0f172a">ご契約は、サイトを見てから。</text>
  <text x="100" y="280" font-size="40" font-family="sans-serif" font-weight="700" fill="#1f2937">ホームページ制作「ミテカラ」</text>
  <text x="100" y="336" font-size="28" font-family="sans-serif" fill="#334155">業種ごとの「集客の勝ち筋」を、ご提案前のサンプルで先にお見せします。</text>
  <rect x="100" y="408" rx="10" width="420" height="64" fill="#3B82F6"/>
  <text x="126" y="450" font-size="24" font-family="sans-serif" fill="#fff">無料で診断レポートを受け取る</text>
  <rect x="540" y="408" rx="10" width="300" height="64" fill="#fff" stroke="#3B82F6" stroke-width="2"/>
  <text x="575" y="450" font-size="24" font-family="sans-serif" fill="#2563eb">サービスの特徴を見る</text>

  <g transform="translate(90,680)">
    <text x="0" y="0" font-size="42" font-family="sans-serif" font-weight="700" fill="#0f172a">ホームページ制作、こんなお悩みはございませんか？</text>
    <rect x="0" y="36" width="1260" height="88" rx="12" fill="#fff" stroke="#e5e7eb"/>
    <rect x="0" y="136" width="1260" height="88" rx="12" fill="#fff" stroke="#e5e7eb"/>
    <rect x="0" y="236" width="1260" height="88" rx="12" fill="#fff" stroke="#e5e7eb"/>
  </g>

  <g transform="translate(90,1080)">
    <text x="0" y="0" font-size="42" font-family="sans-serif" font-weight="700" fill="#0f172a">ミテカラが選ばれる、4つの理由</text>
    <rect x="0" y="36" width="610" height="220" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="650" y="36" width="610" height="220" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="0" y="280" width="610" height="220" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="650" y="280" width="610" height="220" rx="14" fill="#fff" stroke="#e5e7eb"/>
  </g>

  <g transform="translate(90,1660)">
    <text x="0" y="0" font-size="42" font-family="sans-serif" font-weight="700" fill="#0f172a">料金プラン（抜粋）</text>
    <rect x="0" y="36" width="400" height="180" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="430" y="36" width="400" height="180" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="860" y="36" width="400" height="180" rx="14" fill="#fff" stroke="#e5e7eb"/>
  </g>

  <rect y="2200" width="1440" height="200" fill="#0f172a"/>
  <text x="90" y="2270" font-size="28" font-family="sans-serif" fill="#e2e8f0">ミテカラ | 見てから決める、ホームページ制作。</text>
  <text x="90" y="2320" font-size="22" font-family="sans-serif" fill="#bfdbfe">サービス / 運営 / 法務</text>
</svg>
