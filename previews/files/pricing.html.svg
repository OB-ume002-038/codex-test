&lt;main class=&quot;container&quot;&gt;&lt;section&gt;&lt;h1&gt;料金プラン&lt;/h1&gt;&lt;p&gt;業種別のパターン化により、業界相場の約30%割安にてご提供しています。&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;ライト 20〜35万円（税抜）&lt;/h2&gt;&lt;p&gt;1〜3ページ / お問い合わせフォーム / SSL / 公開作業 / 公開後1ヶ月軽微修正。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;スタンダード 50〜70万円（税抜）★おすすめ&lt;/h2&gt;&lt;p&gt;5〜8ページ / お知らせ投稿機能 / 計測設定 / DNS・メール確認込み。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;プレミアム 100〜150万円（税抜）&lt;/h2&gt;&lt;p&gt;10ページ以上 / 撮影込み / 採用ページ専用設計 / 公開後6ヶ月保守付き。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;h2&gt;月額保守&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;ライト保守: 月¥10,000〜¥15,000&lt;/li&gt;&lt;li&gt;スタンダード保守: 月¥25,000〜¥35,000&lt;/li&gt;&lt;li&gt;プレミアム保守: 月¥50,000〜¥80,000&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;/main&gt;
