  <foreignObject x="80" y="190" width="1240" height="1510">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#e2e8f0; font-size:18px; line-height:1.45; white-space:pre-wrap;">
&lt;!doctype html&gt;&lt;html lang=&quot;ja&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;ミテカラ | 見てから決めるホームページ制作&lt;/title&gt;&lt;link rel=&quot;stylesheet&quot; href=&quot;/styles.css&quot;&gt;&lt;/head&gt;&lt;body&gt;
&lt;header&gt;&lt;div class=&quot;container nav&quot;&gt;&lt;div class=&quot;logo&quot;&gt;ミテカラ&lt;/div&gt;&lt;nav class=&quot;nav-links&quot;&gt;&lt;a href=&quot;/#features&quot;&gt;サービス特徴&lt;/a&gt;&lt;a href=&quot;/pricing.html&quot;&gt;料金&lt;/a&gt;&lt;a href=&quot;/faq.html&quot;&gt;よくあるご質問&lt;/a&gt;&lt;a href=&quot;/about.html&quot;&gt;会社概要&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;/contact/index.html&quot;&gt;お問い合わせ&lt;/a&gt;&lt;/nav&gt;&lt;/div&gt;&lt;/header&gt;
&lt;main&gt;
&lt;section class=&quot;hero&quot;&gt;&lt;div class=&quot;container&quot;&gt;&lt;h1&gt;ご契約は、サイトを見てから。&lt;/h1&gt;&lt;p&gt;&lt;strong&gt;ホームページ制作「ミテカラ」&lt;/strong&gt;&lt;br&gt;業種ごとの「集客の勝ち筋」を、ご提案前のサンプルで先にお見せします。&lt;/p&gt;&lt;p&gt;広告運用・マーケティング支援を4年続けてきた制作チームが、業種ごとに体系化した「結果につながるサイト設計」で、業界相場の約30%割安・約半分の納期にてご提供します。&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;btn&quot; href=&quot;/contact/index.html?type=diagnosis&quot;&gt;無料で診断レポートを受け取る&lt;/a&gt; &lt;a class=&quot;btn secondary&quot; href=&quot;#features&quot;&gt;サービスの特徴を見る&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section&gt;&lt;div class=&quot;container&quot;&gt;&lt;h2&gt;ホームページ制作、こんなお悩みはございませんか？&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;☐ 完成イメージが湧かない。打ち合わせと違うものが出てきたら困る&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;☐ 値段が妥当か分からない。相場感がないので騙されたくない&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;☐ 制作後に放置されたら、誰が直してくれるのか不安&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;☐ サイトを作っても、本当に集客や採用に効くのか分からない&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;☐ 制作期間が長すぎる。もっと早く公開したい&lt;/div&gt;&lt;p&gt;ミテカラは、これら全てに正面から答えます。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;features&quot;&gt;&lt;div class=&quot;container&quot;&gt;&lt;h2&gt;ミテカラが選ばれる、4つの理由&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;理由1：ご契約前に、完成形を見ていただけます&lt;/h3&gt;&lt;p&gt;48時間以内に「貴社専用のサンプルサイト」を作成し、お見せした上でご検討いただきます。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;理由2：広告運用4年、集客の成果を出してきた制作チームです&lt;/h3&gt;&lt;p&gt;公開がゴールではなく、公開がスタート。集客に効くサイトをお作りします。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;理由3：業種ごとの「勝ち筋」を、構造としてパターン化しています&lt;/h3&gt;&lt;p&gt;建築・工務店、歯科、食品卸、運送、製造、職人系、葬祭、整骨院、動物病院などに対応。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;理由4：業界相場の約30%割安、約半分の納期&lt;/h3&gt;&lt;p&gt;業界相場（当社調べ）80〜180万円 / 2〜3ヶ月 → ミテカラ 50〜70万円 / 2〜4週間。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section&gt;&lt;div class=&quot;container&quot;&gt;&lt;h2&gt;ご契約までの流れ&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;ご連絡・サンプル作成（無料・48時間以内）&lt;/li&gt;&lt;li&gt;サンプル閲覧・ご検討&lt;/li&gt;&lt;li&gt;ヒアリング（無料・1〜2時間）&lt;/li&gt;&lt;li&gt;正式提案書のご提示（無料）&lt;/li&gt;&lt;li&gt;ご契約・本制作（2〜4週間）&lt;/li&gt;&lt;li&gt;公開・運用サポート開始&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;Step 1〜4はすべて無料です。&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section&gt;&lt;div class=&quot;container&quot;&gt;&lt;h2&gt;料金プラン&lt;/h2&gt;&lt;div class=&quot;grid-3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;ライト&lt;/h3&gt;&lt;p&gt;1〜3ページ&lt;br&gt;20〜35万円（税抜）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;スタンダード ★おすすめ&lt;/h3&gt;&lt;p&gt;5〜8ページ&lt;br&gt;50〜70万円（税抜）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;プレミアム&lt;/h3&gt;&lt;p&gt;10ページ以上 + 撮影込み&lt;br&gt;100〜150万円（税抜）&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a class=&quot;btn secondary&quot; href=&quot;/pricing.html&quot;&gt;詳しい料金プランを見る&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section&gt;&lt;div class=&quot;container&quot;&gt;&lt;h2&gt;よくあるご質問（抜粋）&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;Q.&lt;/strong&gt; サンプルサイトを見るだけでも本当にお金はかかりませんか？&lt;br&gt;&lt;strong&gt;A.&lt;/strong&gt; はい。サンプル閲覧・ヒアリング・正式提案書の作成まで全て無料です。&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;Q.&lt;/strong&gt; うちは小さな会社ですが、相談しても良いですか？&lt;br&gt;&lt;strong&gt;A.&lt;/strong&gt; もちろんです。中小・個人事業主様を中心にご対応しております。&lt;/div&gt;&lt;p&gt;&lt;a class=&quot;btn secondary&quot; href=&quot;/faq.html&quot;&gt;他のご質問を見る&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section&gt;&lt;div class=&quot;container&quot;&gt;&lt;h2&gt;まずは、貴社の無料診断レポートから。&lt;/h2&gt;&lt;p&gt;お問い合わせフォームから、貴社のサイトURLをお送りください。48時間以内に診断レポートをお送りいたします。&lt;/p&gt;&lt;a class=&quot;btn&quot; href=&quot;/contact/index.html?type=diagnosis&quot;&gt;無料で診断レポートを受け取る&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;container&quot;&gt;&lt;p&gt;&lt;strong&gt;ミテカラ&lt;/strong&gt;&lt;br&gt;見てから決める、ホームページ制作。&lt;/p&gt;&lt;p&gt;【サービス】&lt;br&gt;&lt;a href=&quot;/#features&quot;&gt;サービス特徴&lt;/a&gt; / &lt;a href=&quot;/pricing.html&quot;&gt;料金&lt;/a&gt; / &lt;a href=&quot;/faq.html&quot;&gt;よくあるご質問&lt;/a&gt;&lt;/p&gt;&lt;p&gt;【運営】&lt;br&gt;&lt;a href=&quot;/about.html&quot;&gt;会社概要・運営者情報&lt;/a&gt; / &lt;a href=&quot;/contact/index.html&quot;&gt;お問い合わせ&lt;/a&gt;&lt;/p&gt;&lt;p&gt;【法務】&lt;br&gt;&lt;a href=&quot;/legal/tokutei.html&quot;&gt;特定商取引法に基づく表記&lt;/a&gt; / &lt;a href=&quot;/legal/privacy.html&quot;&gt;プライバシーポリシー&lt;/a&gt;&lt;/p&gt;&lt;p&gt;© 2026 Adjust(田中陽光) All Rights Reserved.&lt;/p&gt;&lt;/div&gt;&lt;/footer&gt;
&lt;/body&gt;&lt;/html&gt;
    </div>
  </foreignObject>
</svg>